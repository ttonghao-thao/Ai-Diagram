[project]
name = "ai-diagram-studio-backend"
version = "0.1.0"
description = "AI Diagram Studio backend: GraphDocument model + semantic validation (Phase 0)"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.7,<3",
    "cryptography>=50.0.2,<51",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "jsonschema>=4.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
