services:
  studio:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ai-diagram-studio:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - studio-data:/data/storage
    restart: unless-stopped
    healthcheck:
      # Mirrors the Dockerfile HEALTHCHECK (image-level check also applies).
      test: ["CMD", "python3", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  studio-data:
