services:
  studio:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ai-diagram-studio:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - type: bind
        source: ${STUDIO_DATA_DIR:-/mnt/ai-diagram/data}
        target: /data/storage
        bind:
          create_host_path: true
      - type: bind
        source: ${STUDIO_LOG_DIR:-/mnt/ai-diagram/logs}
        target: /data/logs
        bind:
          create_host_path: true
    restart: unless-stopped
    healthcheck:
      # Mirrors the Dockerfile HEALTHCHECK (image-level check also applies).
      test: ["CMD", "python3", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
